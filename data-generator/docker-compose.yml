version: '3.8'

services:
  # ==================== DATA GENERATION ====================
  
  historical-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile.historical
    volumes:
      - ./data:/data
      - ./data-generator/scripts:/scripts
    environment:
      - EVENTS_PER_DAY=10000
      - DAYS_TO_GENERATE=30
      - START_DATE=2024-01-01
    command: python3 /scripts/generate_historical.py
    networks:
      - security-pipeline

  stream-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile.stream
    volumes:
      - ./data:/data
      - ./data-generator/scripts:/scripts
    environment:
      - LOG_RATE_HIGH=1000
      - LOG_RATE_MEDIUM=200
      - LOG_RATE_LOW=50
      - RUN_DURATION_HOURS=0
    command: python3 /scripts/stream_generator.py
    networks:
      - security-pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== DATA INGESTION ====================
  
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    volumes:
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./data:/data:ro
      - filebeat_data:/usr/share/filebeat/data
      - /var/log:/var/log:ro
    environment:
      - THREAT_INTEL_API_KEY=${THREAT_INTEL_API_KEY}
    depends_on:
      - logstash
    networks:
      - security-pipeline

  # ==================== DATA PROCESSING ====================
  
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    volumes:
      - ./config/logstash:/usr/share/logstash/pipeline:ro
      - ./config/logstash/config:/usr/share/logstash/config:ro
      - ./data:/data:ro
    environment:
      - LS_JAVA_OPTS=-Xmx2g -Xms2g
      - ELASTICSEARCH_HOSTS=elasticsearch:9200
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    ports:
      - "5044:5044"  # Beats
      - "5514:5514"  # Syslog
      - "8080:8080"  # HTTP
    depends_on:
      - elasticsearch
      - redis
      - kafka
    networks:
      - security-pipeline

  # ==================== DATA STORAGE ====================
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms4g -Xmx4g
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - security-pipeline
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - security-pipeline

  # ==================== CACHING ====================
  
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - security-pipeline

  memcached:
    image: memcached:alpine
    ports:
      - "11211:11211"
    command: ["-m", "256", "-l", "0.0.0.0"]
    networks:
      - security-pipeline

  # ==================== MESSAGE QUEUE ====================
  
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_JMX_PORT=9999
      - KAFKA_JMX_HOSTNAME=kafka
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - security-pipeline
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=security
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - security-pipeline

  # ==================== MONITORING ====================
  
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - security-pipeline

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - security-pipeline

# ==================== NETWORKS ====================

networks:
  security-pipeline:
    driver: bridge

# ==================== VOLUMES ====================

volumes:
  elasticsearch_data:
  kibana_data:
  redis_data:
  kafka_data:
  filebeat_data:
  prometheus_data:
  grafana_data: